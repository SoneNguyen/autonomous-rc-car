# Gazebo-side names and types mirror the root README and contracts/topics.md.
# There is one command bridge, ROS -> Gazebo; perception does not publish here.
- ros_topic_name: /model/gazebo_truck/cmd_vel
  gz_topic_name: /model/gazebo_truck/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /model/gazebo_truck/odometry
  gz_topic_name: /model/gazebo_truck/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /model/gazebo_truck/sensors/front_camera/image
  gz_topic_name: /model/gazebo_truck/sensors/front_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /model/gazebo_truck/sensors/front_lidar/scan
  gz_topic_name: /model/gazebo_truck/sensors/front_lidar/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /model/gazebo_truck/sensors/front_lidar/scan/points
  gz_topic_name: /model/gazebo_truck/sensors/front_lidar/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /model/gazebo_truck/sensors/imu
  gz_topic_name: /model/gazebo_truck/sensors/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /model/gazebo_truck/sensors/bumper_contact
  gz_topic_name: /model/gazebo_truck/sensors/bumper_contact
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: gz.msgs.Contacts
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK

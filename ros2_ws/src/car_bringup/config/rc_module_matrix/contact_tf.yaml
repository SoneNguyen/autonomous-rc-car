schema_version: '1.0'
module_id: contact_tf
scenarios:
- schema_version: '1.0'
  world_id: rc_module_matrix
  world_path: simulation/worlds/rc_module_matrix.sdf
  source_refs: &id001
    vehicle_profile:
      path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car
    protocols:
    - matrix-unique-physical-set-v1
    - research-asset-locks-v1
  overlap_refs: &id002
    required: true
    protocol_ids:
    - matrix-unique-physical-set-v1
  module_id: contact_tf
  scenario_id: contact_tf/ground-only
  seed: 62201
  case_kind: nominal
  run_purpose: qualification
  quick_case: true
  start_pose:
    x_m: -12.0
    y_m: -1.2
    z_m: 0.0675
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0.0
      speed_mps: 0.0
  obstacle_placements: []
  setup:
    capture_duration_sim_s: 2.0
    expected_contact_entities: []
    required_sensor_frames:
    - lidar_link
    - camera_link
    - imu_link
  ground_truth:
    description: Gazebo contact fixture identity and every captured sensor-message
      timestamp resolved through the configured static sensor transforms.
    references:
    - path: simulation/models/rc_car/model.sdf
      entity_id: bumper_contact
    - path: ros2_ws/src/car_navigation/car_navigation/sensor_tf_node.py
      entity_id: sensor frame transforms
  measurements:
  - measurement_id: contact_identity
    source: /contacts
    field: collision1 and collision2 entity names
    unit: entity-event
    frame_id: base_link
    sampling: every Gazebo contact message
  - measurement_id: tf_continuity
    source: /tf_static
    field: base_link to each sensor frame
    unit: transform-lookup
    frame_id: base_link
    sampling: lookup at every sensor sample simulation timestamp
  tolerances:
  - tolerance_id: ground-only-contact-identity
    measurement_id: contact_identity
    unit: entity-event
    comparison: categorical
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
  - tolerance_id: ground-only-tf-no-gap
    measurement_id: tf_continuity
    unit: transform-lookup
    comparison: maximum
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
    maximum: 0
  expected_sensor_rates_hz:
    /scan: 10.0
    /imu/data: 100.0

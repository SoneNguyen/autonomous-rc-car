      this is not a hardware accuracy claim.
    minimum: 98.0
    maximum: 102.0
  - tolerance_id: straight-odometry-bound
    measurement_id: odometry_motion
    unit: m,rad
    comparison: maximum
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
    maximum: 0.16

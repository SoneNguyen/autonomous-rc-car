schema_version: '1.0'
module_id: imu_odometry
scenarios:
- schema_version: '1.0'
  world_id: rc_module_matrix
  world_path: simulation/worlds/rc_module_matrix.sdf
  source_refs: &id001
    vehicle_profile:
      path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car
    protocols:
    - matrix-unique-physical-set-v1
    - research-asset-locks-v1
  overlap_refs: &id002
    required: true
    protocol_ids:
    - matrix-unique-physical-set-v1
  module_id: imu_odometry
  scenario_id: imu_odometry/rest-bounds
  seed: 62101
  case_kind: nominal
  run_purpose: qualification
  quick_case: true
  start_pose:
    x_m: -12.0
    y_m: -1.5
    z_m: 0.0675
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0
      speed_mps: 0
  obstacle_placements: []
  setup:
    motion_mode: rest
    capture_duration_sim_s: 4.0
    imu_rate_relative_error_bound: 0.02
  ground_truth:
    description: Fixed-seed rest motion measured against the configured Gazebo sensor
      model and this scenario command profile. These tolerances qualify simulated
      sensor noise only, not physical IMU accuracy.
    references:
    - path: simulation/models/rc_car/model.sdf
      entity_id: imu
    - path: simulation/models/rc_car/model.sdf
      entity_id: AckermannSteering
  expected_sensor_rates_hz:
    /imu/data: 100.0
    /odom: 50.0
  measurements:
  - measurement_id: imu_timestamps
    source: /imu/data
    field: header.stamp
    unit: Hz
    frame_id: imu_link
    configured_rate_hz: 100.0
    sampling: simulation stamp interval across the captured run
  - measurement_id: imu_rest_noise
    source: /imu/data
    field: angular_velocity
    unit: rad/s
    frame_id: imu_link
    configured_rate_hz: 100.0
    sampling: peak vector magnitude at rest
  - measurement_id: imu_gravity
    source: /imu/data
    field: linear_acceleration
    unit: m/s^2
    frame_id: imu_link
    configured_rate_hz: 100.0
    sampling: mean axis values at rest
  - measurement_id: odometry_drift
    source: /odom
    field: pose
    unit: m,rad
    frame_id: odom
    configured_rate_hz: 50.0
    sampling: first-to-last pose delta
  tolerances:
  - tolerance_id: imu-rate-100hz
    measurement_id: imu_timestamps
    unit: Hz
    comparison: interval
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
    minimum: 98.0
    maximum: 102.0
  - tolerance_id: rest-imu-angular-noise
    measurement_id: imu_rest_noise
    unit: rad/s
    comparison: maximum
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
    maximum: 1.0e-05
  - tolerance_id: rest-gravity-error
    measurement_id: imu_gravity
    unit: m/s^2
    comparison: maximum
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
    maximum: 0.01
  - tolerance_id: rest-odometry-drift
    measurement_id: odometry_drift
    unit: m,rad
    comparison: maximum
    derivation: Frozen from the configured simulation model and recorded sensor rate;
      this is not a hardware accuracy claim.
    maximum: 0.001
- schema_version: '1.0'
  world_id: rc_module_matrix
  world_path: simulation/worlds/rc_module_matrix.sdf
  source_refs: *id001
  overlap_refs: *id002
  module_id: imu_odometry
  scenario_id: imu_odometry/straight-line
  seed: 62102
  case_kind: boundary
  run_purpose: qualification
  quick_case: false
  start_pose:
    x_m: -10.0
    y_m: -1.5
    z_m: 0.0675
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0
      speed_mps: 0
    - sim_time_s: 0.5
      speed_mps: 0.2
    - sim_time_s: 3.0
      speed_mps: 0.2
    - sim_time_s: 3.5
      speed_mps: 0
  obstacle_placements: []
  setup:
    motion_mode: straight
    capture_duration_sim_s: 4.0
    imu_rate_relative_error_bound: 0.02
    distance_error_bound_m: 0.16

      entity_id: imu
    - path: simulation/models/rc_car/model.sdf
      entity_id: AckermannSteering
  expected_sensor_rates_hz:
    /imu/data: 100.0
    /odom: 50.0
  measurements:
  - measurement_id: imu_timestamps
    source: /imu/data
    field: header.stamp
    unit: Hz
    frame_id: imu_link
    configured_rate_hz: 100.0
    sampling: simulation stamp interval across the captured run
  - measurement_id: odometry_motion
    source: /odom
    field: pose and twist
    unit: m,rad,m/s
    frame_id: odom
    configured_rate_hz: 50.0
    sampling: first-to-last odometry pose compared with the fixed command integral
  tolerances:
  - tolerance_id: imu-rate-100hz
    measurement_id: imu_timestamps
    unit: Hz
    comparison: interval

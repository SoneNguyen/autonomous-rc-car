  run_purpose: qualification
  quick_case: false
  start_pose:
    x_m: -6.0
    y_m: -1.5
    z_m: 0.0675
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0
      speed_mps: 0
  obstacle_placements: []
  setup:
    motion_mode: pause_reset
    capture_duration_sim_s: 4.0
    imu_rate_relative_error_bound: 0.02
    pause_and_reset_at_sim_s: 1.2
    pause_wall_s: 0.25
  ground_truth:
    description: Fixed-seed pause_reset motion measured against the configured Gazebo
      sensor model and this scenario command profile. These tolerances qualify simulated

    status_period_tolerance_s: 0.15
    minimum_commands_after_stale: 2
  ground_truth:
    description: The matrix-only relay forwards live scans for three simulation seconds,
      then stops forwarding them to the controller. After the configured 0.5 s freshness
      limit, status must expose sensor_lidar_state=stale and readiness_blocker=sensor_lidar_stale;

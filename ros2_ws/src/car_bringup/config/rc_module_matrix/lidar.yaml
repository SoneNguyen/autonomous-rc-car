# LiDAR target poses use z=0.06 m so research meshes intersect the configured single scan plane at the mounted sensor height.
schema_version: '1.0'
module_id: lidar
scenarios:
- schema_version: '1.0'
  module_id: lidar
  scenario_id: lidar/range-min-below
  seed: 61001
  case_kind: boundary
  run_purpose: qualification
  quick_case: false
  world_id: rc_module_matrix
  world_path: simulation/worlds/rc_module_matrix.sdf
  start_pose:
    x_m: -13.0
    y_m: 2.0
    z_m: 0.0
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0.0
      speed_mps: 0.0
  obstacle_placements:
  - entity_id: cone_01
    pose:
      x_m: -12.87
      y_m: 2.000000
      z_m: 0.06
      roll_rad: 0.0
      pitch_rad: 0.0
      yaw_rad: 0.0
  - entity_id: pedestrian_01
    pose:
      x_m: 122102.0
      y_m: 100.0
      z_m: 0.0
      roll_rad: 0.0
      pitch_rad: 0.0
      yaw_rad: 0
  - entity_id: vehicle_01
    pose:
      x_m: 122122.0
      y_m: 120.0
      z_m: 0.0
      roll_rad: 0.0
      pitch_rad: 0.0
      yaw_rad: 0
  setup:
    fixture_sizes_m: &id001
      cone_01:
      - 0.054
      - 0.054
      - 0.07
      pedestrian_01:
      - 0.08
      - 0.08
      - 0.18
      vehicle_01:
      - 0.45
      - 0.22
      - 0.18
    target_entity: cone_01
    target_bearing_rad: 0.0
    target_surface_range_m: 0.02
    sensor_origin_offset_m:
    - 0.11
    - 0.0
    - 0.055
    expected_sector: null
    lighting_preset: neutral_day
    quality_preset: high
  ground_truth:
    description: Configured RC profile and deterministic research fixture pose; range is measured
      from lidar_link origin to the visible research mesh surface.
    references:
    - path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/sensors/lidar
    - path: simulation/worlds/rc_module_matrix.sdf
      entity_id: cone_01
    expected_observations:
    - measurement_id: nearest_return
      expected_value: 0.02
      unit: m
      frame_id: lidar_link
      entity_id: cone_01
  measurements:
  - measurement_id: nearest_return
    source: /scan
    field: ranges
    unit: m
    frame_id: lidar_link
    configured_rate_hz: 10.0
    sampling: nearest finite return in the configured target-beam neighborhood
    expected: 0.02
  tolerances:
  - tolerance_id: range-min-below-range
    measurement_id: nearest_return
    unit: m
    comparison: categorical
    derivation: Compare against the fixture face placed in the configured lidar_link
      frame at the explicit target range; 0.01 m profile resolution.
  source_refs:
    vehicle_profile:
      path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/sensors/lidar
    protocols:
    - matrix-unique-physical-set-v1
    - high-fidelity research locked research assets
  overlap_refs:
    required: true
    protocol_ids:
    - matrix-unique-physical-set-v1
  expected_sensor_rates_hz:
    /scan: 10.0

schema_version: '1.0'
module_id: command_path
scenarios:
- schema_version: '1.0'
  module_id: command_path
  world_id: rc_module_matrix
  world_path: simulation/worlds/rc_module_matrix.sdf
  source_refs: &id001
    vehicle_profile:
      path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car
    controller_bounds:
    - path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/steering/max_speed_mps/value
      expected_value: 1.0
    - path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/steering/effective_center_wheel_limit_rad/value
      expected_value: 0.45
    - path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/steering/max_yaw_rate_radps/value
      expected_value: 1.0
    - path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/geometry/wheelbase_m/value
      expected_value: 0.27
    protocols:
    - matrix-unique-physical-set-v1
    - controller-command-lease-v1
  overlap_refs: &id002
    required: true
    protocol_ids:
    - matrix-unique-physical-set-v1
  scenario_id: command_path/bounds-and-step-response
  seed: 62301
  case_kind: boundary
  run_purpose: qualification
  quick_case: true
  start_pose:
    x_m: -12.0
    y_m: 1.5
    z_m: 0.0675
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0.0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0.0
      speed_mps: 0.0
  obstacle_placements: []
  setup:
    command_test: bounds_and_response
    command_at_sim_s: 2.5
    command_speed_mps: 3.0
    command_steering_rad: 1.0
    capture_duration_sim_s: 4.0
    maximum_step_response_latency_s: 0.75
  ground_truth:
    description: Observed ROS command status and odometry are checked against the
      tracked RC vehicle bounds and controller command-lease threshold.
    references:
    - path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      entity_id: rc_car
    - path: ros2_ws/src/car_autonomy_nodes/car_autonomy_nodes/safe_drive_controller.py
      entity_id: COMMAND_LEASE_NS
  measurements:
  - measurement_id: controller_output
    source: /vehicle_controller/status and /odom
    field: clamped speed/yaw, command age, stop reason, and vehicle response
    unit: m/s,rad/s,s
    frame_id: base_link
    sampling: simulation-time status and odometry samples after the single scheduled
      Ackermann command
  tolerances:
  - tolerance_id: bounds-and-step-response-command-contract
    measurement_id: controller_output
    unit: m/s,rad/s,s
    comparison: categorical
    derivation: Use the tracked controller and RC vehicle bounds; the runtime command
      is intentionally outside the limits.

schema_version: '1.0'
module_id: imu_odometry
scenario_id: imu_odometry/pilot-rest-baseline
seed: 62100
case_kind: nominal
run_purpose: tolerance_pilot
quick_case: false
world_id: rc_module_matrix
world_path: simulation/worlds/rc_module_matrix.sdf
start_pose:
  x_m: -12.0
  y_m: -1.0
  z_m: 0.0675
  roll_rad: 0.0
  pitch_rad: 0.0
  yaw_rad: 0.0
vehicle_motion:
  speed_profile:
  - sim_time_s: 0.0
    speed_mps: 0.0
obstacle_placements: []
setup:
  capture_duration_sim_s: 3.0
  condition_tags:
  - imu_rest_baseline
  - odometry_rest_drift
ground_truth:
  description: The configured sensor SDF and initial stopped vehicle pose define an unscored simulator-only baseline.
  references:
  - path: simulation/models/rc_car/model.sdf
    entity_id: gazebo_truck
  - path: simulation/worlds/rc_module_matrix.sdf
    entity_id: rc_module_matrix
measurements:
- measurement_id: imu_samples
  source: /imu/data
  field: angular_velocity_and_linear_acceleration
  unit: rad/s,m/s^2
  frame_id: imu_link
  configured_rate_hz: 100.0
  sampling: raw simulation-stamped samples; no filtering or noise is added by the checker
- measurement_id: odometry_samples
  source: /odom
  field: pose_and_twist
  unit: m,rad,m/s,rad/s
  frame_id: odom
  configured_rate_hz: null
  sampling: raw simulation-stamped samples; publish rate is measured because the SDF does not configure one
tolerances: []
source_refs:
  vehicle_profile:
    path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
    pointer: /presets/rc_car/sensors/imu
  protocols:
  - matrix-imu-odom-rest-pilot-v1
  - research-asset-locks-v1
overlap_refs:
  required: true
  protocol_ids:
  - matrix-unique-physical-set-v1
expected_sensor_rates_hz:
  /imu/data: 100.0

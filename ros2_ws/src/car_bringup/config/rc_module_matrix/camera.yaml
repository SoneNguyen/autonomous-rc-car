schema_version: '1.0'
module_id: camera
scenarios:
- schema_version: '1.0'
  module_id: camera
  scenario_id: camera/cone-near
  seed: 62010
  case_kind: nominal
  run_purpose: qualification
  quick_case: true
  world_id: rc_module_matrix
  world_path: simulation/worlds/rc_module_matrix.sdf
  start_pose:
    x_m: -13.0
    y_m: 0.0
    z_m: 0.0675
    roll_rad: 0.0
    pitch_rad: 0.0
    yaw_rad: 0.0
  vehicle_motion:
    speed_profile:
    - sim_time_s: 0.0
      speed_mps: 0.0
  obstacle_placements:
  - entity_id: cone_01
    pose:
      x_m: -11.4
      y_m: 0.0
      z_m: 0.0
      roll_rad: 0.0
      pitch_rad: 0.0
      yaw_rad: 0.0
  setup:
    quality_preset: high
    lighting_preset: neutral_day
    capture_duration_sim_s: 1.0
    minimum_box_iou: 0.5
    target_entity: cone_01
    target_class: cone
    distance_band: near
    camera_range_m: 1.5
    target_visible: true
  ground_truth:
    description: Locked research model pose and Gazebo visible instance-label pixels
      at the captured simulation stamp.
    references:
    - path: simulation/worlds/rc_module_matrix.sdf
      entity_id: cone_01
  measurements:
  - measurement_id: visible_target_box
    source: /camera/labels
    field: visible_instance_box
    unit: px
    frame_id: camera_link
    configured_rate_hz: 30.0
    sampling: inclusive bounds of visible panoptic pixels
  - measurement_id: detector_box
    source: /detections
    field: class_and_box
    unit: px
    frame_id: camera_link
    configured_rate_hz: 30.0
    sampling: last exact-stamp aligned detector result
  tolerances:
  - tolerance_id: cone-near-box-iou
    measurement_id: detector_box
    unit: ratio
    comparison: minimum
    minimum: 0.5
    derivation: Frozen matrix detector output must overlap the visible labeled target
      by at least 0.5 IoU.
  source_refs:
    vehicle_profile: &id001
      path: ros2_ws/src/car_bringup/config/rc_vehicle.yaml
      pointer: /presets/rc_car/sensors/camera
    detector_id: rc-module-matrix-frozen-detector-v1
    detector_sha256: 79eafbe11c919fef2f240762b512a3a389cf7bd00fe3076ac43490ef2ae8eaf0
    threshold: 0.8
    protocols:
    - matrix-frozen-detector-v1
    - research-asset-locks-v1
  overlap_refs:
    required: true
    protocol_ids:
    - matrix-unique-physical-set-v1
  expected_sensor_rates_hz:
    /camera/image_raw: 30.0
    /camera/labels: 30.0
